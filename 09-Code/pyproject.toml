[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekdant"
version = "0.1.0"
description = "Ekdant: a windowed transformer backbone with a diverse sandbox reasoning layer"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    # datasets 5.x demands pyarrow>=24, which requires numpy>=2 and breaks
    # conda/Jupyter images pinned to numpy 1.x. Cap both so a bare
    # `pip install -e .` resolves a combo that works on numpy 1.x and 2.x.
    "datasets>=2.19,<5",
    "pyarrow>=12,<21",
    "tokenizers>=0.19",
    # v2 pretrained backbone (SmolLM2-135M); v1 (--task mcq) does not use it.
    # <5: transformers 5.x needs PyTorch >= 2.6 and silently disables its
    # models on the pod's PyTorch 2.2.2 (T30). Mirrored in requirements.txt.
    "transformers>=4.45,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
