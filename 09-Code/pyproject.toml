[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekdant"
version = "0.1.0"
description = "Ekdant: a windowed transformer backbone with a diverse sandbox reasoning layer"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "datasets>=2.19",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
