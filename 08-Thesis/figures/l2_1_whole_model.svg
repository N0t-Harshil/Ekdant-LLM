<svg xmlns="http://www.w3.org/2000/svg" width="940" height="250" viewBox="0 0 940 250" role="img" aria-label="Whole model: SmolLM2 produces the state h; h goes to L2 and along a skip path; the gate mixes h and L2's output y, h' = h + g times (y minus h), and the output layer predicts the next word."><style>
text{font-family:Segoe UI,Inter,Arial,sans-serif;font-size:12.5px;fill:#17191c}
text.t{font-weight:600;font-size:13px} text.s{font-size:11.5px;fill:#575b62}
text.m{font-family:Consolas,monospace;font-size:11.5px}
.box{fill:#ffffff;stroke:#17191c;stroke-width:1.2} .l2box{fill:#e6f0fb;stroke:#2a78d6;stroke-width:1.6}
.acc{stroke:#2a78d6} .accf{fill:#2a78d6} .lane{stroke:#2a78d6;stroke-width:2;fill:none}
</style><rect width="940" height="250" fill="#ffffff"/>
          <defs>
            <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#17191c"/></marker>
            <marker id="a1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="accf"/></marker>
          </defs>
          <rect class="box" x="10" y="95" width="110" height="60" rx="6"/>
          <text class="t" x="65" y="121" text-anchor="middle">Prompt</text>
          <text class="s" x="65" y="139" text-anchor="middle">question (+ abstract)</text>
          <line x1="120" y1="125" x2="160" y2="125" stroke="#17191c" stroke-width="1.4" marker-end="url(#a1)"/>
          <text class="s" x="140" y="115" text-anchor="middle">tokens</text>
          <rect class="box" x="160" y="80" width="170" height="90" rx="6"/>
          <text class="t" x="245" y="110" text-anchor="middle">SmolLM2-135M</text>
          <text x="245" y="130" text-anchor="middle">30 decoder layers</text>
          <text x="245" y="148" text-anchor="middle">+ final RMSNorm</text>
          <line x1="330" y1="125" x2="370" y2="125" stroke="#17191c" stroke-width="1.4"/>
          <circle cx="370" cy="125" r="3.5" fill="#17191c"/>
          <text class="m" x="352" y="115" text-anchor="middle">h</text>
          <!-- skip path -->
          <polyline points="370,125 370,40 660,40 660,105" fill="none" stroke="#17191c" stroke-width="1.4" marker-end="url(#a1)"/>
          <text class="s" x="515" y="32" text-anchor="middle">skip path: h unchanged (576 numbers per token)</text>
          <!-- L2 -->
          <line x1="370" y1="125" x2="415" y2="125" class="acc" stroke-width="1.6" marker-end="url(#a1b)"/>
          <rect class="l2box" x="415" y="85" width="160" height="80" rx="6"/>
          <text class="t" x="495" y="112" text-anchor="middle">L2</text>
          <text x="495" y="131" text-anchor="middle">4 trajectories, debate,</text>
          <text x="495" y="148" text-anchor="middle">descent, average</text>
          <line x1="575" y1="125" x2="640" y2="125" class="acc" stroke-width="1.6" marker-end="url(#a1b)"/>
          <text class="m" x="607" y="115" text-anchor="middle">y</text>
          <!-- mix -->
          <circle cx="660" cy="125" r="20" class="box"/>
          <text class="t" x="660" y="130" text-anchor="middle">g</text>
          <line x1="680" y1="125" x2="730" y2="125" stroke="#17191c" stroke-width="1.4" marker-end="url(#a1)"/>
          <text class="m" x="705" y="115" text-anchor="middle">h′</text>
          <rect class="box" x="730" y="95" width="110" height="60" rx="6"/>
          <text class="t" x="785" y="121" text-anchor="middle">lm_head</text>
          <text class="s" x="785" y="139" text-anchor="middle">49,152 words</text>
          <line x1="840" y1="125" x2="875" y2="125" stroke="#17191c" stroke-width="1.4" marker-end="url(#a1)"/>
          <text class="t" x="905" y="121" text-anchor="middle">next</text>
          <text class="t" x="905" y="137" text-anchor="middle">word</text>
          <text class="m" x="660" y="185" text-anchor="middle">h′ = h + g ⊙ (y − h)</text>
          <text class="s" x="660" y="205" text-anchor="middle">g: one gate per channel (576), starts at 0</text>
          <text class="s" x="660" y="221" text-anchor="middle">trained v5: |g| ≈ 0.025–0.028</text>
        </svg>