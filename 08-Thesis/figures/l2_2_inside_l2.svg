<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" role="img" aria-label="Inside L2: h is projected into four different trajectories; four debate rounds let each trajectory read the other three; eight descent steps pull every trajectory towards an anchor computed from h; the four are averaged into the consensus c."><style>
text{font-family:Segoe UI,Inter,Arial,sans-serif;font-size:12.5px;fill:#17191c}
text.t{font-weight:600;font-size:13px} text.s{font-size:11.5px;fill:#575b62}
text.m{font-family:Consolas,monospace;font-size:11.5px}
.box{fill:#ffffff;stroke:#17191c;stroke-width:1.2} .l2box{fill:#e6f0fb;stroke:#2a78d6;stroke-width:1.6}
.acc{stroke:#2a78d6} .accf{fill:#2a78d6} .lane{stroke:#2a78d6;stroke-width:2;fill:none}
</style><rect width="940" height="360" fill="#ffffff"/>
          <defs>
            <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#17191c"/></marker>
            <marker id="a2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="accf"/></marker>
          </defs>
          <!-- input -->
          <rect class="box" x="10" y="150" width="60" height="50" rx="6"/>
          <text class="m" x="40" y="172" text-anchor="middle">h</text>
          <text class="s" x="40" y="189" text-anchor="middle">576</text>
          <!-- init -->
          <rect class="box" x="105" y="40" width="120" height="270" rx="6"/>
          <text class="t" x="165" y="62" text-anchor="middle">1 · Diverse</text>
          <text class="t" x="165" y="78" text-anchor="middle">start</text>
          <text class="s" x="165" y="292" text-anchor="middle">Tₖ = Wₖh + bₖ</text>
          <line x1="70" y1="175" x2="105" y2="175" stroke="#17191c" stroke-width="1.4" marker-end="url(#a2)"/>
          <!-- lanes -->
          <g class="lane">
            <polyline points="225,110 790,110"/>
            <polyline points="225,160 790,160"/>
            <polyline points="225,210 790,210"/>
            <polyline points="225,260 790,260"/>
          </g>
          <text class="m" x="165" y="114" text-anchor="middle">T₁</text>
          <text class="m" x="165" y="164" text-anchor="middle">T₂</text>
          <text class="m" x="165" y="214" text-anchor="middle">T₃</text>
          <text class="m" x="165" y="264" text-anchor="middle">T₄</text>
          <!-- debate -->
          <rect class="box" x="265" y="40" width="230" height="270" rx="6" fill-opacity="0.85"/>
          <text class="t" x="380" y="62" text-anchor="middle">2 · Debate rounds × 4</text>
          <text class="s" x="380" y="78" text-anchor="middle">each round has its own weights</text>
          <g class="lane">
            <polyline points="265,110 495,110"/><polyline points="265,160 495,160"/>
            <polyline points="265,210 495,210"/><polyline points="265,260 495,260"/>
          </g>
          <!-- cross reads -->
          <g class="acc" stroke-width="1.2" fill="none" stroke-dasharray="3 3">
            <line x1="330" y1="114" x2="330" y2="156" marker-end="url(#a2b)" marker-start="url(#a2b)"/>
            <line x1="360" y1="164" x2="360" y2="206" marker-end="url(#a2b)" marker-start="url(#a2b)"/>
            <line x1="390" y1="214" x2="390" y2="256" marker-end="url(#a2b)" marker-start="url(#a2b)"/>
            <path d="M420 114 C 455 150, 455 220, 420 256" marker-end="url(#a2b)" marker-start="url(#a2b)"/>
          </g>
          <text class="s" x="380" y="292" text-anchor="middle">each Tₖ reads the other 3, never itself</text>
          <!-- descent -->
          <rect class="box" x="535" y="40" width="200" height="270" rx="6" fill-opacity="0.85"/>
          <text class="t" x="635" y="62" text-anchor="middle">3 · Anchored descent × 8</text>
          <text class="s" x="635" y="78" text-anchor="middle">pull towards anchor a</text>
          <g class="lane">
            <polyline points="535,110 735,110"/><polyline points="535,160 735,160"/>
            <polyline points="535,210 735,210"/><polyline points="535,260 735,260"/>
          </g>
          <text class="s" x="635" y="292" text-anchor="middle">Tₖ ← Tₖ − η·gate⊙(Tₖ − a)</text>
          <!-- anchor from h -->
          <polyline points="40,200 40,335 635,335 635,312" fill="none" stroke="#17191c" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a2)"/>
          <text class="s" x="330" y="328" text-anchor="middle">anchor a = Wₐh (computed from the same h)</text>
          <!-- mean -->
          <polyline points="790,110 820,185" class="lane"/><polyline points="790,160 820,185" class="lane"/>
          <polyline points="790,210 820,185" class="lane"/><polyline points="790,260 820,185" class="lane"/>
          <circle cx="830" cy="185" r="16" class="l2box"/>
          <text class="t" x="830" y="190" text-anchor="middle">x̄</text>
          <text class="t" x="830" y="62" text-anchor="middle">4 · Average</text>
          <line x1="846" y1="185" x2="890" y2="185" stroke="#17191c" stroke-width="1.4" marker-end="url(#a2)"/>
          <text class="m" x="912" y="182" text-anchor="middle">c</text>
          <text class="s" x="912" y="199" text-anchor="middle">576</text>
        </svg>